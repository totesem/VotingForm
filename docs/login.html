<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VotingForm - Log In</title>

    <style>
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .login-button {
            padding: 8px 14px;
            text-decoration: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f2f2f2;
            color: #333;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <a href="login.html" class="login-button">
        Log In
    </a>
</div>

<h1>Log In</h1>

<form id="loginForm">

    <label>
        Email:
        <br>
        <input type="email" id="email" required>
    </label>

    <br><br>

    <label>
        Password:
        <br>
        <input type="password" id="password" required>
    </label>

    <br><br>

    <button type="submit">
        Log In
    </button>

</form>

<p id="message"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="login.js"></script>

</body>
</html>
