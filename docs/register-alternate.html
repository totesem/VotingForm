    <title>VotingForm Alternate Registration</title>

<body>

<h1>VotingForm</h1>

<p id="status">Checking your invitation...</p>

<div id="registration" style="display:none;">

    <h2>Register as an Alternate</h2>

    <p id="invitedEmail"></p>

    <div id="nameArea">

        <label>
            Name (First Last):
            <br>
            <input type="text" id="name" required>
        </label>

        <br><br>

    </div>

    <label>
        Email for your ballot account:
        <br>
        <input type="email" id="email" required>
    </label>

    <br><br>

    <label>
        Password:
        <br>
        <input type="password" id="password" required>
    </label>

    <br><br>

    <label>
        Confirm Password:
        <br>
        <input type="password" id="confirmPassword" required>
    </label>

    <br><br>

    <button type="button" id="createAccount" disabled>
        Create Account
    </button>

</div>

<p id="message"></p>
