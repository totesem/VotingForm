<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VotingForm</title>
</head>

<body>

<p id="ballotName" style="font-size: 28px;">Loading ballot...</p>

<form id="voteForm">

    <h2 style="font-weight: normal; text-decoration: underline;">Your Vote</h2>

    <label>
        <input type="radio" name="vote" value="Yes" required>
        Yes
    </label>

    <label>
        <input type="radio" name="vote" value="No">
        No
    </label>

    <label>
        <input type="radio" name="vote" value="Abstain">
        Abstain
    </label>

    <h2 style="font-weight: normal; text-decoration: underline;">Comments</h2>

    <textarea
        id="comment"
        name="comment"
        rows="5"
        cols="50"
        placeholder="Optional comments"></textarea>

    <br><br>

    <button type="submit">Submit Vote</button>

</form>

<hr>

<h2 style="font-weight: normal; text-decoration: underline;">
    Use an Alternate
</h2>

<p>
    If you would like someone else to vote on your behalf, enter their email address below.
</p>

<input
    type="email"
    id="alternateEmail"
    placeholder="Alternate's email"
>

<button
    type="button"
    id="createAlternate"
    disabled
>
    Send Alternate Invitation
</button>

<p id="alternateMessage"></p>

<div id="alternateLinkArea" style="display:none;">

    <p>
        Send this link to your alternate:
    </p>

    <input
        type="text"
        id="alternateLink"
        readonly
        style="width: 500px;"
    >

    <button
        type="button"
        id="copyAlternateLink"
    >
        Copy Link
    </button>

</div>

<p>
    <a id="resultsLink" href="#">Track Results</a>
</p>

<p id="message"></p>

<button id="switchAccount" style="display:none;">
    Switch Account
</button>

</body>
</html>
