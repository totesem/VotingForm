<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ballot Report</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #ballotName {
            font-size: 20px;
            margin-bottom: 30px;
        }

        h2 {
            font-weight: normal;
            text-decoration: underline;
            margin-top: 35px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #f2f2f2;
        }

        .summary-table {
            width: auto;
            min-width: 700px;
        }

        .summary-table th,
        .summary-table td {
            text-align: center;
        }

        .summary-table th:first-child,
        .summary-table td:first-child {
            text-align: left;
        }

        .not-voted {
            color: #777;
            font-style: italic;
        }

        #message {
            margin-top: 20px;
        }

        .pass {
            background-color: #c6efce;
            color: #006100;
        }

        .fail {
            background-color: #ffc7ce;
            color: #9c0006;
        }

        #pdfButton {
            margin-bottom: 20px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        @media print {

            #pdfButton,
            #message {
                display: none !important;
            }

            body {
                margin: 20px;
            }

        }

    </style>

</head>

<body>

    <h1>Ballot Report</h1>

    <div id="ballotName">
        Loading ballot...
    </div>

    <button id="pdfButton" style="display:none;">
        Save as PDF
    </button>

    <div id="message"></div>

    <h2>Summary by Interest Category</h2>

    <table id="summaryTable" class="summary-table">

        <thead>
            <tr>
                <th>Interest</th>
                <th>Voters</th>
                <th>Voted</th>
                <th>Did Not Vote</th>
                <th>Yes</th>
                <th>No</th>
                <th>Abstain</th>
                <th>% Yes</th>
            </tr>
        </thead>

        <tbody id="summaryBody">
        </tbody>

    </table>

    <h2>Voter Details</h2>

    <table id="voterTable">

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Interest</th>
                <th>Vote</th>
                <th>Vote Comments</th>
                <th>Notes</th>
            </tr>
        </thead>

        <tbody id="voterBody">
        </tbody>

    </table>

    <script src="report.js"></script>

</body>

</html>
